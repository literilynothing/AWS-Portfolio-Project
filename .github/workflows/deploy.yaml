name: Deploy to AWS

# Defines the event that triggers the workflow
on:
  push:
    branches:
      - main

# Deploy job
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

# Check out the code from the repository-------------------------
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

# Configures and validates temporary AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          
      - name: Verify AWS credentials
        run: |
          aws sts get-caller-identity >/dev/null
          echo "GitHub Actions authenticated to AWS"

# Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

# Build and push the Docker image to Docker Hub-------------------
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/aws-portfolio-project:${{ github.sha }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/aws-portfolio-project:latest

# Deploys the Docker image to the EC2 instance via SSM
      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/aws-portfolio-project:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          PARAMETERS=$(jq -cn --arg image "$IMAGE" '{
            commands: [
              "set -euo pipefail",
              "if ! command -v docker >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y docker.io; fi",
              "sudo docker pull " + $image,
              "sudo docker rm -f my-app 2>/dev/null || true",
              "sudo docker run -d --name my-app --restart unless-stopped -p 80:80 " + $image
            ]
          }')

          COMMAND_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          for attempt in $(seq 1 60); do
            if RESULT=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json 2>&1); then
              STATUS=$(jq -r '.Status' <<< "$RESULT")
              case "$STATUS" in
                Success)
                  jq -r '.StandardOutputContent' <<< "$RESULT"
                  exit 0
                  ;;
                Failed|TimedOut|Cancelled|Cancelling)
                  jq '{Status, StatusDetails, StandardOutputContent, StandardErrorContent}' <<< "$RESULT"
                  exit 1
                  ;;
              esac
            elif [[ "$RESULT" != *InvocationDoesNotExist* ]]; then
              echo "$RESULT" >&2
              exit 1
            fi
            sleep 5
          done

          echo "Timed out waiting for the SSM deployment command" >&2
          exit 1